services:
  jenkins:
    image: jenkins/jenkins:lts-jdk11
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    networks:
      - cicd_network
    dns:
      - 8.8.8.8
      - 4.4.4.4

volumes:
  jenkins_home:
    external: true
    name: jenkins_home

networks:
    cicd_network:
        driver: bridge